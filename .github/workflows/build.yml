name: Generate and Build Extreme Charge APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Scaffold Complete Android Project
      run: |
        mkdir -p app/src/main/java/com/example/extremecharge

        # 1. gradle.properties
        cat << 'EOF' > gradle.properties
        org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
        android.useAndroidX=true
        android.nonTransitiveRClass=true
        EOF

        # 2. settings.gradle.kts
        cat << 'EOF' > settings.gradle.kts
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
                google()
                mavenCentral()
            }
        }
        rootProject.name = "PixelExtremeCharge"
        include(":app")
        EOF

        # 3. Root build.gradle.kts
        cat << 'EOF' > build.gradle.kts
        plugins {
            id("com.android.application") version "8.2.2" apply false
            id("org.jetbrains.kotlin.android") version "1.9.22" apply false
        }
        EOF

        # 4. app/build.gradle.kts
        cat << 'EOF' > app/build.gradle.kts
        plugins {
            id("com.android.application")
            id("org.jetbrains.kotlin.android")
        }

        android {
            namespace = "com.example.extremecharge"
            compileSdk = 34

            defaultConfig {
                applicationId = "com.example.extremecharge"
                minSdk = 26
                targetSdk = 34
                versionCode = 1
                versionName = "1.0"
            }

            compileOptions {
                sourceCompatibility = JavaVersion.VERSION_17
                targetCompatibility = JavaVersion.VERSION_17
            }
            kotlinOptions {
                jvmTarget = "17"
            }
            buildFeatures {
                compose = true
            }
            composeOptions {
                kotlinCompilerExtensionVersion = "1.5.8"
            }
        }

        dependencies {
            implementation("androidx.core:core-ktx:1.12.0")
            implementation("androidx.activity:activity-compose:1.8.2")
            implementation(platform("androidx.compose:compose-bom:2024.02.00"))
            implementation("androidx.compose.ui:ui")
            implementation("androidx.compose.material3:material3")
            implementation("rikka.shizuku:api:13.1.5")
            implementation("rikka.shizuku:provider:13.1.5")
        }
        EOF

        # 5. AndroidManifest.xml
        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">

            <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
            <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE" />
            <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />

            <application
                android:allowBackup="true"
                android:icon="@android:drawable/ic_lock_idle_charging"
                android:label="Extreme Charge"
                android:supportsRtl="true"
                android:theme="@android:style/Theme.Material.Light.NoActionBar">

                <activity
                    android:name=".MainActivity"
                    android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>

                <service
                    android:name=".ExtremeChargeService"
                    android:exported="false"
                    android:foregroundServiceType="specialUse" />

            </application>
        </manifest>
        EOF

        # 6. MainActivity.kt (Complete Logic)
        cat << 'EOF' > app/src/main/java/com/example/extremecharge/MainActivity.kt
        package com.example.extremecharge

        import android.app.Notification
        import android.app.NotificationChannel
        import android.app.NotificationManager
        import android.app.Service
        import android.content.BroadcastReceiver
        import android.content.Context
        import android.content.Intent
        import android.content.IntentFilter
        import android.content.pm.PackageManager
        import android.os.BatteryManager
        import android.os.Build
        import android.os.Bundle
        import android.os.IBinder
        import androidx.activity.ComponentActivity
        import androidx.activity.compose.setContent
        import androidx.compose.foundation.layout.*
        import androidx.compose.material3.*
        import androidx.compose.runtime.*
        import androidx.compose.ui.Alignment
        import androidx.compose.ui.Modifier
        import androidx.compose.ui.unit.dp
        import androidx.core.app.NotificationCompat
        import rikka.shizuku.Shizuku
        import java.io.BufferedReader
        import java.io.InputStreamReader

        object ShizukuRunner {
            fun hasPermission(): Boolean {
                return if (Shizuku.isPre_V11()) false
                else Shizuku.checkSelfPermission() == PackageManager.PERMISSION_GRANTED
            }

            fun exec(cmd: String): String {
                return try {
                    val process = Shizuku.newProcess(arrayOf("sh", "-c", cmd), null, null)
                    val reader = BufferedReader(InputStreamReader(process.inputStream))
                    val output = reader.readText()
                    process.waitFor()
                    output
                } catch (e: Exception) {
                    "Error: ${e.localizedMessage}"
                }
            }
        }

        class ExtremeChargeService : Service() {
            private var isActive = false

            private val batteryReceiver = object : BroadcastReceiver() {
                override fun onReceive(context: Context?, intent: Intent?) {
                    intent ?: return

                    val level = intent.getIntExtra(BatteryManager.EXTRA_LEVEL, -1)
                    val scale = intent.getIntExtra(BatteryManager.EXTRA_SCALE, -1)
                    val pct = (level / scale.toFloat()) * 100

                    val status = intent.getIntExtra(BatteryManager.EXTRA_STATUS, -1)
                    val isCharging = status == BatteryManager.BATTERY_STATUS_CHARGING ||
                                     status == BatteryManager.BATTERY_STATUS_FULL

                    val tempTenths = intent.getIntExtra(BatteryManager.EXTRA_TEMPERATURE, 0)
                    val tempC = tempTenths / 10.0f

                    if (isCharging && pct <= 50 && tempC < 42.0f) {
                        if (!isActive) enableMode()
                    } else if (!isCharging || pct > 50 || tempC >= 42.0f) {
                        if (isActive) disableMode()
                    }
                }
            }

            private fun enableMode() {
                if (!ShizukuRunner.hasPermission()) return
                ShizukuRunner.exec("dumpsys deviceidle force-idle")
                ShizukuRunner.exec("cmd jobscheduler cancel-all")
                ShizukuRunner.exec("am kill-all")
                isActive = true
            }

            private fun disableMode() {
                if (!ShizukuRunner.hasPermission()) return
                ShizukuRunner.exec("dumpsys deviceidle unforce")
                isActive = false
            }

            override fun onCreate() {
                super.onCreate()
                val channelId = "extreme_charge_channel"
                if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                    val channel = NotificationChannel(
                        channelId,
                        "Extreme Charging Watchdog",
                        NotificationManager.IMPORTANCE_LOW
                    )
                    val manager = getSystemService(NotificationManager::class.java)
                    manager?.createNotificationChannel(channel)
                }

                val notification: Notification = NotificationCompat.Builder(this, channelId)
                    .setContentTitle("Extreme Charging Active")
                    .setContentText("Monitoring battery status (< 50% threshold)")
                    .setSmallIcon(android.R.drawable.ic_lock_idle_charging)
                    .build()

                startForeground(1001, notification)
                registerReceiver(batteryReceiver, IntentFilter(Intent.ACTION_BATTERY_CHANGED))
            }

            override fun onDestroy() {
                unregisterReceiver(batteryReceiver)
                if (isActive) disableMode()
                super.onDestroy()
            }

            override fun onBind(intent: Intent?): IBinder? = null
        }

        class MainActivity : ComponentActivity() {
            private val shizukuListener = Shizuku.OnRequestPermissionResultListener { _, _ -> }

            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
                Shizuku.addRequestPermissionResultListener(shizukuListener)

                setContent {
                    MaterialTheme {
                        Surface(
                            modifier = Modifier.fillMaxSize(),
                            color = MaterialTheme.colorScheme.background
                        ) {
                            ChargeScreen(
                                onStartService = {
                                    val intent = Intent(this, ExtremeChargeService::class.java)
                                    if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                                        startForegroundService(intent)
                                    } else {
                                        startService(intent)
                                    }
                                },
                                onStopService = {
                                    stopService(Intent(this, ExtremeChargeService::class.java))
                                },
                                onRequestShizuku = {
                                    if (Shizuku.pingBinder()) {
                                        Shizuku.requestPermission(100)
                                    }
                                }
                            )
                        }
                    }
                }
            }

            override fun onDestroy() {
                Shizuku.removeRequestPermissionResultListener(shizukuListener)
                super.onDestroy()
            }
        }

        @Composable
        fun ChargeScreen(
            onStartService: () -> Unit,
            onStopService: () -> Unit,
            onRequestShizuku: () -> Unit
        ) {
            var hasPermission by remember { mutableStateOf(ShizukuRunner.hasPermission()) }
            var serviceRunning by remember { mutableStateOf(false) }

            Column(
                modifier = Modifier
                    .fillMaxSize()
                    .padding(24.dp),
                horizontalAlignment = Alignment.CenterHorizontally,
                verticalArrangement = Arrangement.Center
            ) {
                Text(
                    text = "Pixel Extreme Charging",
                    style = MaterialTheme.typography.headlineMedium
                )
                Spacer(modifier = Modifier.height(16.dp))
                Text(
                    text = "Automates deep idle below 50% battery to reduce chassis heat while preserving cellular calls & SMS.",
                    style = MaterialTheme.typography.bodyMedium
                )
                Spacer(modifier = Modifier.height(32.dp))

                if (!hasPermission) {
                    Button(onClick = {
                        onRequestShizuku()
                        hasPermission = ShizukuRunner.hasPermission()
                    }) {
                        Text("Grant Shizuku Permission")
                    }
                } else {
                    Button(
                        colors = ButtonDefaults.buttonColors(
                            containerColor = if (serviceRunning) MaterialTheme.colorScheme.error else MaterialTheme.colorScheme.primary
                        ),
                        onClick = {
                            if (serviceRunning) {
                                onStopService()
                                serviceRunning = false
                            } else {
                                onStartService()
                                serviceRunning = true
                            }
                        }
                    ) {
                        Text(if (serviceRunning) "Stop Monitoring" else "Enable Automation")
                    }
                }
            }
        }
        EOF

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Compile Debug APK
      run: gradle assembleDebug

    - name: Upload APK to Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ExtremeCharge-debug-apk
        path: app/build/outputs/apk/debug/*.apk
